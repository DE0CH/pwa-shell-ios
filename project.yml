# XcodeGen spec of a native SwiftUI client for a Jarvis (DE0CH/claudecodeui) server. Generate with scripts/configure.sh (it writes Generated/ first), never by hand:
# the site, name, bundle id, language and icon are build inputs, not part of the source.
name: PWAShell
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ${PWA_LANGUAGE}
  createIntermediateGroups: true
packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    exactVersion: 2.4.1
configFiles:
  Debug: Generated/Config.xcconfig
  Release: Generated/Config.xcconfig
targets:
  PWAShell:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: Generated/Resources
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_NAME: PWAShell
        PRODUCT_BUNDLE_IDENTIFIER: $(PWA_BUNDLE_ID)
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: $(PWA_BUILD_NUMBER)
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(PWA_TEAM_ID)
    dependencies:
      - package: MarkdownUI
        product: MarkdownUI
  PWAShellUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(PWA_BUNDLE_ID).uitests
        TEST_TARGET_NAME: PWAShell
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(PWA_TEAM_ID)
    dependencies:
      - target: PWAShell
schemes:
  PWAShell:
    build:
      targets:
        PWAShell: all
    test:
      targets:
        - PWAShellUITests
